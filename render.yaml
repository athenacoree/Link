databases:
  - name: link-db
    plan: free
    databaseName: link
    user: link

services:
  - type: web
    name: link
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: link-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: STORY_CLEANUP_INTERVAL_MIN
        value: "15"
      # MONGODB_URI no se genera sola: pégala tú a mano en el panel de
      # Render después de crear tu cluster gratuito en MongoDB Atlas.
      - key: MONGODB_URI
        sync: false
      # Correo(s) que se vuelven administrador automáticamente al iniciar
      # sesión (separados por coma). Pégalo tú a mano en el panel de Render.
      - key: ADMIN_EMAILS
        sync: false
      # Clave de API de OpenRouter para la Inteligencia Artificial (secreta)
      - key: OPENROUTER_API_KEY
        sync: false
      # Modelo por defecto de OpenRouter configurable desde Render
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
