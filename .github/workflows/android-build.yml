name: Build Enlace Bridge Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/enlace-bridge/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/enlace-bridge/**'

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Signing Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/enlace-bridge/app/release.jks

      - name: Build Release APK
        working-directory: android/enlace-bridge
        run: |
          chmod +x gradlew || true
          if [ -f "app/release.jks" ]; then
            echo "Keystore encontrada. Compilando APK Release firmada..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=app/release.jks \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
          else
            echo "KEYSTORE_BASE64 secret no provista, compilando APK Release no firmada..."
            ./gradlew assembleRelease
          fi

      - name: Clean up temporary keystore
        if: always()
        run: |
          rm -f android/enlace-bridge/app/release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enlace-bridge-apk
          path: android/enlace-bridge/app/build/outputs/apk/release/*.apk
          retention-days: 30
